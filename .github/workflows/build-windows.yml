name: Build Windows components

on:
  pull_request:
    paths:
      - "apps/cloudbox-*/**"
      - "CloudBox.slnx"
      - "global.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CloudBox.slnx --configuration Release
      - run: dotnet test CloudBox.slnx --configuration Release --no-build --logger "console;verbosity=normal"
      - run: dotnet publish apps/cloudbox-agent -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - run: dotnet publish apps/cloudbox-status -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: List published files (must be the two exes only)
        run: Get-ChildItem publish | Format-Table Name, Length -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: CloudBox.Agent-win-x64
          path: |
            publish/CloudBox.Agent.exe
            publish/CloudBox.Status.exe
          if-no-files-found: error
