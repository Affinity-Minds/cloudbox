name: Build Windows components

on:
  pull_request:
    paths:
      - "apps/cloudbox-*/**"
      - "CloudBox.slnx"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CloudBox.slnx --configuration Release
