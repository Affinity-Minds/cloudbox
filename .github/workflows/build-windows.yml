name: Build Windows components

on:
  pull_request:
    paths:
      - "apps/cloudbox-*/**"
      - "CloudBox.slnx"
      - "global.json"
      - "packages/licensing-contracts/test/vectors/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CloudBox.slnx --configuration Release
      - run: dotnet test CloudBox.slnx --configuration Release --no-build --logger "console;verbosity=detailed"
      - run: dotnet publish apps/cloudbox-agent -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/agent
      - run: dotnet publish apps/cloudbox-status -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/status

      # Third-party binaries are acquired, never vendored: pinned URL + SHA-256 from third-party.lock.json.
      - name: Fetch pinned third-party payload (verify SHA-256)
        shell: pwsh
        run: |
          $lock = Get-Content apps/cloudbox-server-setup/third-party.lock.json -Raw | ConvertFrom-Json
          foreach ($c in $lock.components) {
            $dest = Join-Path "payload" $c.payload
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Invoke-WebRequest -Uri $c.url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item $dest).Length
            Write-Host "$($c.name): sha256 $hash, $size bytes"
            if ($hash -ne $c.sha256) { throw "SHA-256 mismatch for $($c.name): downloaded $hash, lock file pins $($c.sha256)" }
          }

      - name: Stage Setup payload (Agent, Status, notices)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payload/agent, payload/status | Out-Null
          Copy-Item publish/agent/CloudBox.Agent.exe payload/agent/
          Get-ChildItem publish/status -File | Where-Object { $_.Extension -ne ".pdb" } | Copy-Item -Destination payload/status/
          Copy-Item THIRD_PARTY_NOTICES.md payload/
          Get-ChildItem payload -Recurse -File | Format-Table FullName, Length -AutoSize

      - name: Publish CloudBox.Server.Setup.exe (payload embedded)
        shell: pwsh
        run: dotnet publish apps/cloudbox-server-setup -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:PayloadDir=$PWD\payload" -o publish/setup

      - name: List published files
        shell: pwsh
        run: Get-ChildItem publish -Recurse -File | Format-Table FullName, Length -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: CloudBox.Agent-win-x64
          path: |
            publish/agent/CloudBox.Agent.exe
            publish/status/*
            !publish/status/*.pdb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: CloudBox.Server-win-x64
          path: |
            publish/setup/CloudBox.Server.Setup.exe
            publish/status/*
            !publish/status/*.pdb
          if-no-files-found: error
